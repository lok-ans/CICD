name: firstworkflow
on: 
  push: 
    branches: 
      - main  
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install dependencies 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Test cases
        run: pytest -v
