name: firstworkflow
on: push
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step1 - pwd ls hostname
        run: |
          pwd
          ls -altr
          hostname
      - name: Step 2 - checkout
        uses: actions/checkout@v6.1.0
      - name: Step 3 - pwd ls hostname
        run: |
          echo `pwd` >> myartifact.txt 
          mkdir artifacts
          echo `ls -altr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Step 4 - upload a single file artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple directory/paths
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Multiple_path_directory_artifacts
          path: |
            ./myartifact.txt
            artifacts/
      - name: Upload from multiple directory/paths with exclusions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Multiple_path_directory_artifacts_with_exclusion
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
          
