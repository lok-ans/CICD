name: firstworkflow
on: push
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step1 - pwd ls hostname
        run: |
          pwd
          ls -altr
          hostname
      - name: Step 2 - checkout
        uses: actions/checkout@v6.1.0
      - name: Step 3 - pwd ls hostname
        run: |
          echo `pwd` >> myartifact.txt 
          ls -altr
          hostname
      - name: Step 4 - upload a single file artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name : single_file
          path : ./myartifact.txt
